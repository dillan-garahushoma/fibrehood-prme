  new THREE.SphereGeometry(R * 0.995, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0x333943, wireframe: true, transparent: true, opacity: 0.18 })
);
globe.add(grid);

// atmosphere rim glow
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.035, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0x2f6fed, transparent: true, opacity: 0.07, side: THREE.BackSide })
);
globe.add(atmo);

// land dot-matrix
const landPositions = [];
for (let i = 0; i < LAND.length; i += 2) {
  const v = latLonToVec3(LAND[i], LAND[i+1], R * 1.001);
  landPositions.push(v.x, v.y, v.z);
}
const landGeo = new THREE.BufferGeometry();
landGeo.setAttribute('position', new THREE.Float32BufferAttribute(landPositions, 3));
const landMat = new THREE.PointsMaterial({ color: 0x6f9fe0, size: 0.028, sizeAttenuation: true, transparent: true, opacity: 0.85 });
const landPoints = new THREE.Points(landGeo, landMat);
globe.add(landPoints);

// city markers
const markerTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(242,181,68,0.9)');
  g.addColorStop(1, 'rgba(242,181,68,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

const markerMeshes = CITIES.map(city => {
  const pos = latLonToVec3(city.lat, city.lon, R * 1.005);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: markerTex, transparent: true, depthWrite: false,
    color: city.hub ? 0xffffff : 0xf2b544
  }));
  sprite.position.copy(pos);
  sprite.scale.set(0.22, 0.22, 1);
  globe.add(sprite);
  return { city, sprite, pos, label: null };
});

// labels (HTML overlay, projected each frame)
markerMeshes.forEach(m => {
  const div = document.createElement('div');
  div.className = 'label';
  div.innerHTML = '<span class="dot"></span>' + m.city.name;
  stage.appendChild(div);
  m.label = div;
});

// gold arcs from hub to each other city
function slerpArc(a, b, segments, bump) {
  const qa = a.clone().normalize(), qb = b.clone().normalize();
  const angle = qa.angleTo(qb);
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const s = Math.sin(angle) || 1e-6;
    const w1 = Math.sin((1 - t) * angle) / s;
    const w2 = Math.sin(t * angle) / s;
    const p = new THREE.Vector3(qa.x*w1+qb.x*w2, qa.y*w1+qb.y*w2, qa.z*w1+qb.z*w2);
    const h = 1 + bump * Math.sin(t * Math.PI);
    p.multiplyScalar(R * h);
    pts.push(p);
  }
  return pts;
}

const hub = markerMeshes.find(m => m.city.hub);
const arcs = markerMeshes.filter(m => !m.city.hub).map((m, idx) => {
  const segments = 72;
  const pts = slerpArc(hub.pos, m.pos, segments, 0.22);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xf2b544, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
  const line = new THREE.Line(geo, mat);
  geo.setDrawRange(0, 0);
  globe.add(line);
  return { line, geo, segments, delay: idx * 1.1, cycle: 6 + idx * 0.6 };
});

window.addEventListener('resize', () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  globe.rotation.y = t * 0.16;

  // pulse + fade markers/labels based on whether they face the camera
  markerMeshes.forEach(m => {
    const world = new THREE.Vector3();
    m.sprite.getWorldPosition(world);
    const facing = world.z / R; // -1..1, >0 roughly front-facing
    const visible = THREE.MathUtils.smoothstep(facing, -0.05, 0.35);
    const pulse = 0.22 + Math.sin(t * 2.4 + (m.city.hub ? 0 : 2)) * 0.03;
    m.sprite.scale.set(pulse * (0.9 + visible*0.3), pulse * (0.9 + visible*0.3), 1);
    m.sprite.material.opacity = visible;

    const ndc = world.clone().project(camera);
    const x = (ndc.x * 0.5 + 0.5) * stage.clientWidth;
    const y = (-ndc.y * 0.5 + 0.5) * stage.clientHeight;
    m.label.style.left = x + 'px';
    m.label.style.top = y + 'px';
    m.label.style.opacity = visible.toFixed(2);
  });

  // animate arcs "forming" in a staggered loop, only fully opaque while endpoints face camera
  arcs.forEach(a => {
    const local = ((t - a.delay) % a.cycle + a.cycle) % a.cycle;
    const drawT = THREE.MathUtils.clamp(local / (a.cycle * 0.35), 0, 1);
    a.geo.setDrawRange(0, Math.floor(drawT * a.segments));
    const fadeOut = local > a.cycle * 0.75 ? 1 - (local - a.cycle*0.75)/(a.cycle*0.25) : 1;
    a.line.material.opacity = 0.85 * fadeOut;
  });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
